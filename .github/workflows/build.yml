name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Engine tests
        run: swift test

      - name: Build app
        run: |
          xcodebuild -project Spacewise.xcodeproj -scheme Spacewise -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build

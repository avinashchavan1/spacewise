name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Engine tests
        run: swift test

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project Spacewise.xcodeproj -scheme Spacewise -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Package app
        if: success()
        run: |
          APP=build/Build/Products/Release/Spacewise.app
          test -d "$APP"
          ditto -c -k --keepParent "$APP" Spacewise-macOS.zip

      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Spacewise-macOS
          path: Spacewise-macOS.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
